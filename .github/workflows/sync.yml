name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/xgonce/Cloudflare_IP.git || true
          git fetch upstream
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git push origin main
